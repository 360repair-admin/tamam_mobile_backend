postgres: &postgres
  adapter: postgresql
  encoding: unicode
  timeout: 5000
  pool: <%= ENV.fetch("RAILS_MAX_THREADS", 5) %>
  checkout_timeout: 5
  reaping_frequency: 10
  prepared_statements: true
  idle_timeout: 300

local: &local
  <<: *postgres
  username: postgres
  password: postgres

development:
  primary:
    <<: *local
    database: tamam_mobile_development

test:
  primary:
    <<: *local
    database: tamam_mobile_test

staging:
  primary: &primary_staging
    <<: *postgres
    url: <%= ENV["DATABASE_URL"] %>

  cache:
    <<: *primary_staging
    migrations_paths: db/cache_migrate

  queue:
    <<: *primary_staging
    migrations_paths: db/queue_migrate

  cable:
    <<: *primary_staging
    migrations_paths: db/cable_migrate

production:
  primary: &primary_production
    <<: *postgres
    url: <%= ENV["DATABASE_URL"] %>

  cache:
    <<: *primary_production
    migrations_paths: db/cache_migrate

  queue:
    <<: *primary_production
    migrations_paths: db/queue_migrate

  cable:
    <<: *primary_production
    migrations_paths: db/cable_migrate
